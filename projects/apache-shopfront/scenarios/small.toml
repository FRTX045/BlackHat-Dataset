# The fast-iteration tier. Timestamps are untouched: the log spans however long
# the run actually took.
#
# Phase B values are placeholders sized for proving the machinery, not for
# producing a dataset. Task 15 sets the real ones once the persona driver
# exists and its achieved throughput has been measured.

kind = "weblog-truth"
seed = 7

# What the finished small tier aims for. The Phase B driver issues ten fixed
# requests and ignores these; they are here so the scenario contract is in
# place before anything depends on it.
target_lines = 50000
attack_share_target = 0.05

[traffic]
# Virtual seconds of arrivals to plan, and session arrivals per virtual second.
# The driver issues them as fast as it can; the virtual span is what the
# medium-tier timestamp remap will later stretch. At this rate a small run is
# a few thousand lines and takes well under a minute.
duration_seconds = 7200
session_rate = 0.22
concurrency = 32

# Malformed requests over raw sockets, from the reserved address.
noise_requests = 120

[personas]
# Attack share came out at 1.17% against a 2-8% target with scanner at 0.05.
# The lever is the scanner rather than the campaigns: real attack volume in an
# access log is dominated by opportunistic scanning, not by targeted
# intrusions, and a scanner session is a dozen requests with no asset cascade
# behind it while a shopper session is fifty lines of which forty are images.
shopper = 0.26
casual = 0.29
returning = 0.09
mobile = 0.13
crawler = 0.07
monitor = 0.03
scanner = 0.13

[attacks]
# Every campaign runs, concurrently with the ordinary traffic. Two of the six
# are expected to come away with nothing, which is what most real attack
# traffic looks like.
campaigns = [
    "patient_operator", "webshell_operator", "blind_injector",
    "metadata_hunter", "credential_hunter", "fruitless_prober",
]
# Divide every operator pause by this. 1.0 would take the hour the playbook
# timings describe; the small tier is for iteration.
pace = 25.0
