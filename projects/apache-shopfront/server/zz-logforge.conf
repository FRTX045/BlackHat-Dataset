# LogForge logging and client-address configuration.
#
# The filename sorts last in conf-enabled/ on purpose. Debian's security.conf
# sets ServerTokens OS, and conf-enabled files load alphabetically, so a file
# named logforge.conf would have its ServerTokens silently overridden.

RemoteIPHeader X-Forwarded-For

# Only the tag proxy and the driver may declare a client address. Attacker
# containers are left untrusted deliberately: their real container address is
# what lands in %h, and no tool can decide its own origin by sending a header.
RemoteIPTrustedProxy 203.0.113.3
RemoteIPTrustedProxy 203.0.113.4

# Both formats are redefined rather than inherited. Debian's stock `combined`
# uses %O -- bytes on the wire, headers included -- which never emits "-". The
# canonical Combined Log Format uses %b, so a 304 records "-" rather than a
# header count, which is what every log-analysis tool reading this dataset will
# expect.
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
LogFormat "%{X-Request-Id}i %h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" tagged

# The build polls this path to decide the server is up. It is the one class of
# request deliberately kept out of the dataset: it carries no request id, and it
# is an artefact of the harness rather than traffic anyone sent. Every other
# request Apache handles is logged, including the malformed ones.
SetEnvIf Request_URI "^/\.lab-health$" dontlog

CustomLog /var/log/apache2/access.log combined env=!dontlog
CustomLog /var/log/apache2/access.tagged.log tagged env=!dontlog
ErrorLog  /var/log/apache2/error.log
LogLevel  warn

# A fingerprinting tool should have a real banner to fingerprint.
ServerTokens Full
ServerSignature On

# Set globally as well as in the vhost, so error.log is not opened with a
# warning about the FQDN on every start. The dataset's error log should
# contain the server's real problems, not our configuration's.
ServerName shop.test
