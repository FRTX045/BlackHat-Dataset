# The one and only vhost, so it is also the default: a request with no Host
# header, or a request line malformed enough that Apache rejects it before
# selecting a vhost, is handled here. Those lines are a deliberate part of the
# dataset.
#
# No CustomLog or ErrorLog here on purpose -- both are set at server level in
# conf-enabled/zz-logforge.conf, so nothing Apache logs can escape them.

<VirtualHost *:80>
    ServerName shop.test
    ServerAlias localhost

    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # The upload directory executes PHP. This is deliberate and documented --
    # see app/VULNERABILITIES.md.
    <Directory /var/www/html/uploads>
        Require all granted
    </Directory>

    # Pretty URLs. %r logs the request line as it arrived, so the log records
    # /c/tools and /p/17 -- what the client actually asked for -- rather than
    # the rewritten query-string form.
    RewriteEngine On
    RewriteRule ^/c/([a-z0-9-]+)/?$   /category.php?slug=$1 [L,QSA]
    RewriteRule ^/p/([0-9]+)/?$       /product.php?id=$1    [L,QSA]
    RewriteRule ^/sitemap\.xml$       /sitemap.php          [L]
    RewriteRule ^/search/?$           /search.php           [L,QSA]
    RewriteRule ^/about/?$            /about.php            [L,QSA]
    RewriteRule ^/contact/?$          /contact.php          [L,QSA]
    RewriteRule ^/cart/?$             /cart.php             [L,QSA]
    RewriteRule ^/checkout/?$         /checkout.php         [L,QSA]

    ErrorDocument 404 /404.php
    ErrorDocument 500 /500.php
</VirtualHost>
