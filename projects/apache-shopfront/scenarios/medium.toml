# A week of shop traffic. Roughly four times the small tier's volume, spread
# over seven days instead of one, which is what makes the weekly rhythm
# visible at all -- a single-day log can show a diurnal cycle and cannot show
# a weekend.
#
# Sized from the small tier's measured throughput rather than guessed: that
# run produced about 42 lines per session at roughly 330 lines/second of wall
# clock, so the numbers below are about 6,000 sessions, a quarter of a million
# lines, and somewhere near fifteen minutes of building.

kind = "logarc-truth"
seed = 19

# Top-level: above the first [table] header, or TOML makes them keys of it.
target_lines = 250000
attack_share_target = 0.05

[timeline]
remap = true
# The same Monday the small tier starts on, so the two tiers line up and a
# consumer comparing them is comparing the same week.
start = "2026-03-09T00:00:00+00:00"
# Seven days. At this line count that is about 0.4 requests a second, which is
# what a small shop actually does; a busier rate would need a longer run, not
# a shorter window.
duration_seconds = 604800

[traffic]
# Must equal [timeline] duration_seconds: the driver plans a week of arrivals
# and the remap places them across that same week. 0.0125 across seven days is
# about 4,800 sessions, roughly the 250,000-line target at the measured ~53
# lines per session.
duration_seconds = 604800
# 0.0135 across seven days is about 5,200 sessions, roughly the 250,000-line
# target at the measured 46 lines per session. That figure fell from 53 when
# crawlers and monitors were raised to a realistic share, because their
# sessions are short.
session_rate = 0.0135
# Higher than small: the run is longer, and the point of the medium tier is
# volume. Above about 48 the driver starts losing connections rather than
# going faster, which shows up as 500s the application never generated.
concurrency = 40

noise_requests = 400

[browser]
# Same personas as the small tier, paced closer to real reading time: this run
# has a week of virtual span to fill and can afford the wall clock.
enabled = true
pace = 3.0

[personas]
# Same mix as the small tier. The tiers differ in volume and in span, not in
# what the traffic is -- a medium run that changed the persona weights could
# not be used to check whether a detector trained on small generalises.
shopper = 0.20
casual = 0.19
returning = 0.08
mobile = 0.10
crawler = 0.16
monitor = 0.09
# The shop's own staff. A small share on purpose: a shop this size
# has one or two people with an admin login, not a workforce.
admin = 0.03
# A trade customer's system polling the stock endpoint. It is here for what it
# contradicts rather than for its volume: without it every HTTP-library
# User-Agent in the corpus is hostile, so a rule keying on that string cannot
# be wrong here. Weights are relative, so adding one leaves the proportions
# among the others exactly as they were.
integration = 0.03
scanner = 0.12

[attacks]
campaigns = [
    "patient_operator", "webshell_operator", "blind_injector",
    "metadata_hunter", "credential_hunter", "fruitless_prober",
    "cms_bot", "cve_sweeper", "greedy_scraper", "api_abuser",
]
# Operators the draw may not leave out. Each is the only source of a category
# the coverage floor below asks for -- metadata_hunter of ssrf, blind_injector
# of path_traversal, credential_hunter of credential_attack. Everyone else
# varies. Measured: a draw without metadata_hunter took ssrf from five lines to
# zero, which is not a smaller dataset but a differently-shaped one.
required = ["metadata_hunter", "blind_injector", "credential_hunter"]
# Slower than the small tier's 25.0. The run is longer, so the operators can
# afford to be closer to the pace their playbooks describe, and the phases
# spread further across the ordinary traffic they hide in.
pace = 8.0

# hydra-login is declared but not run; see small.toml for why.
tools = ["whatweb-root", "dirb-common", "gobuster-common", "nmap-http",
         "sqlmap-search"]

# What this tier has to contain to be worth shipping. Campaigns are reactive,
# so what they achieve depends on what the application gives up -- a build that
# comes in under this refuses rather than quietly publishing a tier with no
# exploitation in it. Answer a shortfall by changing the roster, never by
# re-rolling the seed until it passes.
[attacks.coverage]
exploitation = 1
injection = 5
access_control = 5
credential_attack = 5
# One is enough for these two: it is the *appearance* of a class that must be
# guaranteed, not how much of it there is. A real day at a small shop may
# genuinely hold a single traversal attempt, and manufacturing twenty to make
# a per-class score stable would be choosing the measurement. Per-class scoring
# at these supports is unreliable; the larger tiers are where it means anything.
ssrf = 1
path_traversal = 1
