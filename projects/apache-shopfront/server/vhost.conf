# The one and only vhost, so it is also the default: a request with no Host
# header, or a request line malformed enough that Apache rejects it before
# selecting a vhost, is handled here. Those lines are a deliberate part of the
# dataset.
#
# No CustomLog or ErrorLog here on purpose -- both are set at server level in
# conf-enabled/zz-logforge.conf, so nothing Apache logs can escape them.

<VirtualHost *:80>
    ServerName shop.test
    ServerAlias localhost

    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # PLANTED WEAKNESS 5, second half.
    #
    # The stock php.load config sets the PHP handler with a FilesMatch anchored
    # to the end of the name, so only real .php files run. AddHandler goes
    # through mod_mime instead, which treats a name as a list of extensions and
    # will run anything with .php anywhere among them -- shell.php.jpg
    # included. This is the classic misconfiguration and it is here on purpose.
    # See app/VULNERABILITIES.md.
    <Directory /var/www/html/uploads>
        Require all granted
        AddHandler application/x-httpd-php .php
    </Directory>

    # Pretty URLs. %r logs the request line as it arrived, so the log records
    # /c/tools and /p/17 -- what the client actually asked for -- rather than
    # the rewritten query-string form.
    RewriteEngine On
    RewriteRule ^/c/([a-z0-9-]+)/?$   /category.php?slug=$1 [L,QSA]
    RewriteRule ^/p/([0-9]+)/?$       /product.php?id=$1    [L,QSA]
    RewriteRule ^/sitemap\.xml$       /sitemap.php          [L]
    RewriteRule ^/search/?$           /search.php           [L,QSA]
    RewriteRule ^/about/?$            /about.php            [L,QSA]
    RewriteRule ^/contact/?$          /contact.php          [L,QSA]
    RewriteRule ^/cart/?$             /cart.php             [L,QSA]
    RewriteRule ^/checkout/?$         /checkout.php         [L,QSA]
    RewriteRule ^/download/?$         /download.php         [L,QSA]
    RewriteRule ^/login/?$            /login.php            [L,QSA]
    RewriteRule ^/logout/?$           /logout.php           [L,QSA]
    RewriteRule ^/register/?$         /register.php         [L,QSA]
    RewriteRule ^/password-reset/?$   /password-reset.php   [L,QSA]

    RewriteRule ^/account/orders/?$        /account/orders.php    [L,QSA]
    RewriteRule ^/account/orders/([0-9]+)$ /account/order.php?id=$1 [L,QSA]
    RewriteRule ^/account/addresses/?$     /account/addresses.php [L,QSA]
    RewriteRule ^/account/avatar/?$        /account/avatar.php    [L,QSA]

    RewriteRule ^/admin/users/?$        /admin/users.php        [L,QSA]
    RewriteRule ^/admin/orders/?$       /admin/orders.php       [L,QSA]
    RewriteRule ^/admin/ping/?$         /admin/ping.php         [L,QSA]
    RewriteRule ^/admin/template/?$     /admin/template.php     [L,QSA]
    RewriteRule ^/admin/import-image/?$ /admin/import-image.php [L,QSA]

    # The front-end calls these without an extension, so %r records /api/cart
    # rather than /api/cart.php -- which is what the XHR actually asked for.
    RewriteRule ^/api/([a-z-]+)/?$ /api/$1.php [L,QSA]

    ErrorDocument 404 /404.php
    ErrorDocument 500 /500.php
</VirtualHost>
