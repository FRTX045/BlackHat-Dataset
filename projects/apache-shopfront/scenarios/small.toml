# The fast-iteration tier: a day of shop traffic, built in a few minutes.

kind = "logarc-truth"
seed = 7

# Top-level, and they must stay above the first [table] header or TOML makes
# them keys of it. They were swallowed into [timeline] once and nothing
# noticed, because at the time nothing read them.
target_lines = 75000
attack_share_target = 0.05

[timeline]
# The driver issues its whole plan as fast as the sockets allow, so the
# captured log covers about three minutes at three hundred requests a second.
# The sequence is right and the timing is not, and nothing time-based can be
# studied on it. This puts the same lines, in the same per-session order, on a
# clock the traffic model actually describes.
#
# It is a rewrite and it ships as one: `access.raw.log` is the capture,
# timestamps and all, and the manifest says which is which.
remap = true
# A Monday, so a week-long medium run starts where this one does and the two
# tiers can be read against each other. Fixed rather than taken from the build
# date: the same seed should produce the same clock next year.
start = "2026-03-09T00:00:00+00:00"
duration_seconds = 86400

[traffic]
# The window the driver plans its arrivals across, and the arrival rate in it.
#
# It must equal [timeline] duration_seconds above, and a test enforces that.
# The driver plans a day of sessions and the remap places them on that same
# day; a driver planning two hours while the remap spread them over one would
# produce sessions that are individually real and collectively describe no
# density at all.
#
# The rate is per *virtual* second at a diurnal multiplier of 1.0, so it is
# small: 0.022 across a day is about 1,400 sessions, which at the measured
# ~53 lines per session is roughly the 75,000-line target. Retuned from 0.22
# when the planning window went from two hours to twenty-four, then from
# 0.035 when a build at that rate came out at 120,630 lines -- the first
# estimate divided total lines by the remap's episode count, which also
# counts tool runs and campaign phases.
duration_seconds = 86400
session_rate = 0.022
concurrency = 32

# Malformed requests over raw sockets, from the reserved address.
noise_requests = 120

[browser]
# Real Chromium, through Playwright. The only source here that does not decide
# what to request: it is handed a URL and the log records what the browser
# chose to ask for, in the order it chose, including the requests it declined
# to make because the response was already in its cache.
#
# A small share of sessions on purpose. Chromium is expensive, and the value
# is in having genuine browser-ordered cascades present at all rather than in
# having most of the log come from them.
enabled = true
pace = 8.0

[personas]
# Attack share came out at 1.17% against a 2-8% target with scanner at 0.05.
# The lever is the scanner rather than the campaigns: real attack volume in an
# access log is dominated by opportunistic scanning, not by targeted
# intrusions, and a scanner session is a dozen requests with no asset cascade
# behind it while a shopper session is fifty lines of which forty are images.
# Retuned after comparing the finished log against published characteristics
# of real public web logs. Automated traffic came out at 5.2% of lines against
# a real-world 20-50%: crawler and monitor were 10% of *sessions*, and their
# sessions are short, so they were a much smaller share of *lines*.
#
# A real shop of this size is crawled continuously -- the search engines, the
# SEO crawlers, the AI crawlers, and at least one uptime monitor hitting a
# health URL every minute, which alone is 1,440 lines a day. Raising these two
# also brings the Referer share down, because none of them sends one, and that
# was sitting at 90% against a real-world 40-70%.
shopper = 0.20
casual = 0.19
returning = 0.08
mobile = 0.10
crawler = 0.18
monitor = 0.10
# The shop's own staff. A small share on purpose: a shop this size
# has one or two people with an admin login, not a workforce.
admin = 0.03
scanner = 0.12

[attacks]
# Every campaign runs, concurrently with the ordinary traffic. Two of the six
# are expected to come away with nothing, which is what most real attack
# traffic looks like.
campaigns = [
    "patient_operator", "webshell_operator", "blind_injector",
    "metadata_hunter", "credential_hunter", "fruitless_prober",
    "cms_bot", "cve_sweeper", "greedy_scraper", "api_abuser",
]
# Operators the draw may not leave out. Each is the only source of a category
# the coverage floor below asks for -- metadata_hunter of ssrf, blind_injector
# of path_traversal, credential_hunter of credential_attack. Everyone else
# varies. Measured: a draw without metadata_hunter took ssrf from five lines to
# zero, which is not a smaller dataset but a differently-shaped one.
required = ["metadata_hunter", "blind_injector", "credential_hunter"]
# Divide every operator pause by this. 1.0 would take the hour the playbook
# timings describe; the small tier is for iteration.
pace = 25.0

# Real security tools, each in its own container behind the tag proxy so its
# requests acquire a request id and join as exactly as a driver request does.
# Named individually rather than "all": adding a tool to toolruns.py should be
# a decision about a scenario, not a silent change to every dataset built
# afterwards.
#
# `hydra-login` is declared in toolruns.py and deliberately absent here: its
# http-post-form module blocks against a login that answers 401 without a
# WWW-Authenticate header, producing about one request per run. The reason is
# recorded beside the declaration. Credential attacks against that endpoint
# come from the hand-written playbooks instead.
#
# The `-small` wordlist variants, not the `-common` ones: this tier covers a
# single day, and two 4,614-word walks inside it put enumeration at 11% of the
# log and the attack share at 14% against a 2-8% target. The medium tier has a
# week to fit them into and uses the full list.
tools = ["whatweb-root", "dirb-small", "gobuster-small", "nmap-http",
         "sqlmap-search"]

# What this tier has to contain to be worth shipping. Campaigns are reactive,
# so what they achieve depends on what the application gives up -- a build that
# comes in under this refuses rather than quietly publishing a tier with no
# exploitation in it. Answer a shortfall by changing the roster, never by
# re-rolling the seed until it passes.
[attacks.coverage]
exploitation = 1
injection = 5
access_control = 5
credential_attack = 5
# One is enough for these two: it is the *appearance* of a class that must be
# guaranteed, not how much of it there is. A real day at a small shop may
# genuinely hold a single traversal attempt, and manufacturing twenty to make
# a per-class score stable would be choosing the measurement. Per-class scoring
# at these supports is unreliable; the larger tiers are where it means anything.
ssrf = 1
path_traversal = 1
