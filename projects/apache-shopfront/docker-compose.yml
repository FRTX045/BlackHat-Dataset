name: logforge-apache-shopfront

# Three networks, not one network with three IPAM configs: Docker's bridge
# driver rejects more than one subnet per network outright. Bridges are also
# isolated from each other, so anything every source must be able to reach --
# the server, and later the tag proxy -- attaches to all three.
#
# The explicit `name:` keeps the network names stable regardless of the compose
# project name, because the attacker containers in Phase E join them by name.
networks:
  lab_res:
    name: lab_res
    ipam:
      config:
        - subnet: 203.0.113.0/24
          gateway: 203.0.113.1
  lab_cloud:
    name: lab_cloud
    ipam:
      config:
        - subnet: 198.51.100.0/24
          gateway: 198.51.100.1
  lab_dc:
    name: lab_dc
    ipam:
      config:
        - subnet: 192.0.2.0/24
          gateway: 192.0.2.1

services:
  web:
    build: ./server
    image: logforge/apache-shopfront-web:dev
    # There is deliberately no `ports:` mapping and there must never be one.
    # This application is intentionally vulnerable; it is reachable from the
    # lab networks and from nowhere else.
    volumes:
      # Bind-mounted rather than baked in, because Phase C is a great deal of
      # PHP iteration and a rebuild per edit is friction with no benefit.
      - ./app:/var/www/html
      - ./server/logs:/var/log/apache2
    networks:
      lab_res:
        ipv4_address: 203.0.113.2
      lab_cloud:
        ipv4_address: 198.51.100.2
      lab_dc:
        ipv4_address: 192.0.2.2

  tagproxy:
    image: python:3.12-slim
    # Stdlib only, so the stock image needs nothing added to it.
    command:
      - python
      - /opt/logforge/projects/apache-shopfront/traffic/tagproxy.py
      - --ports=/opt/logforge/projects/apache-shopfront/traffic/ports.json
      - --ledger=/opt/logforge/projects/apache-shopfront/traffic/ledger/tagproxy.jsonl
    volumes:
      # Read-only, with the ledger directory mounted back over it as the one
      # writable path: this container's only side effect should be the record
      # of what it forwarded.
      - ../..:/opt/logforge:ro
      - ./traffic/ledger:/opt/logforge/projects/apache-shopfront/traffic/ledger
    depends_on:
      - web
    networks:
      # On all three networks so a tool on any of them can reach it. It always
      # talks to Apache over lab_res, though, because 203.0.113.3 is the
      # address RemoteIPTrustedProxy names.
      lab_res:
        ipv4_address: 203.0.113.3
      lab_cloud:
        ipv4_address: 198.51.100.3
      lab_dc:
        ipv4_address: 192.0.2.3

  # One-shot: started with `compose run`, never `up`. It declares each request's
  # client address itself, which is why 203.0.113.4 is in RemoteIPTrustedProxy,
  # and mints its own request ids, so it needs no tag proxy.
  driver:
    build: ./traffic
    image: logforge/apache-shopfront-driver:dev
    command:
      - python
      - /opt/logforge/projects/apache-shopfront/traffic/driver.py
      - --ledger=/opt/logforge/projects/apache-shopfront/traffic/ledger/driver.jsonl
      - --catalogue=/opt/logforge/projects/apache-shopfront/app/data/catalogue.json
    volumes:
      - ../..:/opt/logforge:ro
      - ./traffic/ledger:/opt/logforge/projects/apache-shopfront/traffic/ledger
    networks:
      lab_res:
        ipv4_address: 203.0.113.4

  # One-shot. Its address is reserved for nothing else, which is the whole
  # point: the malformed shapes it sends never reach mod_remoteip, so Apache
  # logs them against this address and the join can label them by it exactly.
  # It is deliberately NOT in RemoteIPTrustedProxy -- it has no address to
  # declare and no business declaring one.
  noise:
    image: python:3.12-slim
    command:
      - python
      - /opt/logforge/projects/apache-shopfront/traffic/noise.py
      - --ledger=/opt/logforge/projects/apache-shopfront/traffic/ledger/noise.jsonl
    volumes:
      - ../..:/opt/logforge:ro
      - ./traffic/ledger:/opt/logforge/projects/apache-shopfront/traffic/ledger
    networks:
      lab_res:
        ipv4_address: 203.0.113.6

  attacker-patient-operator:
    image: python:3.12-slim
    command:
      - python
      - /opt/logforge/projects/apache-shopfront/attacks/runner.py
      - patient_operator
      - --ledger=/opt/logforge/projects/apache-shopfront/traffic/ledger/attack-patient_operator.jsonl
    volumes:
      - ../..:/opt/logforge:ro
      - ./traffic/ledger:/opt/logforge/projects/apache-shopfront/traffic/ledger
    networks:
      lab_dc:
        ipv4_address: 192.0.2.21
  attacker-webshell-operator:
    image: python:3.12-slim
    command:
      - python
      - /opt/logforge/projects/apache-shopfront/attacks/runner.py
      - webshell_operator
      - --ledger=/opt/logforge/projects/apache-shopfront/traffic/ledger/attack-webshell_operator.jsonl
    volumes:
      - ../..:/opt/logforge:ro
      - ./traffic/ledger:/opt/logforge/projects/apache-shopfront/traffic/ledger
    networks:
      lab_dc:
        ipv4_address: 192.0.2.22
  attacker-credential-hunter:
    image: python:3.12-slim
    command:
      - python
      - /opt/logforge/projects/apache-shopfront/attacks/runner.py
      - credential_hunter
      - --ledger=/opt/logforge/projects/apache-shopfront/traffic/ledger/attack-credential_hunter.jsonl
    volumes:
      - ../..:/opt/logforge:ro
      - ./traffic/ledger:/opt/logforge/projects/apache-shopfront/traffic/ledger
    networks:
      lab_dc:
        ipv4_address: 192.0.2.23
  attacker-blind-injector:
    image: python:3.12-slim
    command:
      - python
      - /opt/logforge/projects/apache-shopfront/attacks/runner.py
      - blind_injector
      - --ledger=/opt/logforge/projects/apache-shopfront/traffic/ledger/attack-blind_injector.jsonl
    volumes:
      - ../..:/opt/logforge:ro
      - ./traffic/ledger:/opt/logforge/projects/apache-shopfront/traffic/ledger
    networks:
      lab_cloud:
        ipv4_address: 198.51.100.21
  attacker-metadata-hunter:
    image: python:3.12-slim
    command:
      - python
      - /opt/logforge/projects/apache-shopfront/attacks/runner.py
      - metadata_hunter
      - --ledger=/opt/logforge/projects/apache-shopfront/traffic/ledger/attack-metadata_hunter.jsonl
    volumes:
      - ../..:/opt/logforge:ro
      - ./traffic/ledger:/opt/logforge/projects/apache-shopfront/traffic/ledger
    networks:
      lab_cloud:
        ipv4_address: 198.51.100.22
  attacker-fruitless-prober:
    image: python:3.12-slim
    command:
      - python
      - /opt/logforge/projects/apache-shopfront/attacks/runner.py
      - fruitless_prober
      - --ledger=/opt/logforge/projects/apache-shopfront/traffic/ledger/attack-fruitless_prober.jsonl
    volumes:
      - ../..:/opt/logforge:ro
      - ./traffic/ledger:/opt/logforge/projects/apache-shopfront/traffic/ledger
    networks:
      lab_cloud:
        ipv4_address: 198.51.100.23

  # ------------------------------------------------------------------------
  # Real security tools. One-shot, started with `compose run`, never `up`.
  #
  # Each one carries only an image, an address and the mount it needs. The
  # command is supplied by `tools/build.py` from `attacks/toolruns.py`, which
  # is also what the manifest records verbatim -- writing the argument vectors
  # here as well would give the dataset two sources of truth about what ran,
  # and the one in the manifest would eventually be the wrong one.
  #
  # Every tool is pointed at the tag proxy on :8080, never at Apache. Tools do
  # not send our request-id header; the proxy stamps one on the way through,
  # so a sqlmap request joins to its truth record as exactly as a driver
  # request does. Peer mode means the address the proxy declares is the tool
  # container's own, which is what makes the manifest's source-address column
  # true rather than asserted.
  #
  # The default command below is never used by the build. It is a version
  # query so that a service started by hand reports what it is and exits,
  # instead of sitting there having attacked nothing.
  tool-sqlmap-search:
    build: ./attacks
    image: logforge/apache-shopfront-attacker:dev
    command: ["dpkg-query", "-W", "sqlmap"]
    volumes:
      - ../..:/opt/logforge:ro
    networks:
      lab_dc:
        ipv4_address: 192.0.2.31

  # whatweb rather than nikto: nikto was dropped from Debian and bookworm has
  # no package for it, so there is no way to pin its version from the archive
  # the way every other tool here is pinned.
  tool-whatweb-root:
    build: ./attacks
    image: logforge/apache-shopfront-attacker:dev
    command: ["dpkg-query", "-W", "whatweb"]
    volumes:
      - ../..:/opt/logforge:ro
    networks:
      lab_dc:
        ipv4_address: 192.0.2.32

  tool-hydra-login:
    build: ./attacks
    image: logforge/apache-shopfront-attacker:dev
    command: ["dpkg-query", "-W", "hydra"]
    volumes:
      - ../..:/opt/logforge:ro
    networks:
      lab_dc:
        ipv4_address: 192.0.2.33

  tool-dirb-common:
    build: ./attacks
    image: logforge/apache-shopfront-attacker:dev
    command: ["dpkg-query", "-W", "dirb"]
    volumes:
      - ../..:/opt/logforge:ro
    networks:
      lab_cloud:
        ipv4_address: 198.51.100.31

  # Deliberately over the same wordlist dirb uses. Two tools covering
  # identical ground leave visibly different traces, and a log holding both is
  # a better test of whether a detector learned the tool or the behaviour.
  tool-gobuster-common:
    build: ./attacks
    image: logforge/apache-shopfront-attacker:dev
    command: ["dpkg-query", "-W", "gobuster"]
    volumes:
      - ../..:/opt/logforge:ro
    networks:
      lab_cloud:
        ipv4_address: 198.51.100.33

  # The same two tools over dirb's 959-word small.txt. The one-day tier uses
  # these; the week-long tier uses the 4,614-word common.txt above. Two full
  # walks inside a single day put the attack share at 14% against a 2-8%
  # target, and are more scanning than one small shop sees in a day anyway.
  tool-gobuster-small:
    build: ./attacks
    image: logforge/apache-shopfront-attacker:dev
    command: ["dpkg-query", "-W", "gobuster"]
    volumes:
      - ../..:/opt/logforge:ro
    networks:
      lab_cloud:
        ipv4_address: 198.51.100.34

  tool-dirb-small:
    build: ./attacks
    image: logforge/apache-shopfront-attacker:dev
    command: ["dpkg-query", "-W", "dirb"]
    volumes:
      - ../..:/opt/logforge:ro
    networks:
      lab_cloud:
        ipv4_address: 198.51.100.35

  tool-nmap-http:
    build: ./attacks
    image: logforge/apache-shopfront-attacker:dev
    command: ["dpkg-query", "-W", "nmap"]
    volumes:
      - ../..:/opt/logforge:ro
    networks:
      lab_cloud:
        ipv4_address: 198.51.100.32
