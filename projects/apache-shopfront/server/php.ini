; Deliberately shaped like a small shop's production server that has been set
; up by someone competent but not paranoid.

; Errors are logged, never shown. A 500 that prints its stack trace to the
; browser would be a 200 with error text in it, and the dataset needs a real
; 500 in the access log with a matching line in the error log.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL

; Left on so a fingerprinting tool has something real to fingerprint: the
; X-Powered-By header is exactly the kind of thing recon traffic looks for.
expose_php = On

; Small, so the upload surface behaves like a real avatar uploader.
upload_max_filesize = 2M
post_max_size = 4M

date.timezone = UTC
